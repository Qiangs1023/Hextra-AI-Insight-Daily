# Hugo configuration file
title: 数字旷野 日报

timezone: Asia/Shanghai
enableRobotsTXT: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: true
enableInlineShortcodes: true

services:  
  googleAnalytics:
    ID: "G-SECWWMY8WQ"

outputs:
  home: [html]
  page: [html]
  section: [html, rss]

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

params:
  adsenseId: "ca-pub-8136412975724403"
  umamiKey: "2b24e36d-6e56-499b-8b7e-aea4d308caff"
  ahrefsKey-del: "Qe0ZpZJ6/W8rgMFnLgk4kg"
  description: 个人每日整理的AI资讯站。我们为您过滤信息噪音，只提供最精选的AI新闻、最实用的AI工具与AI教程，助您高效获取人工智能领域的前沿动态
  descriptionEn: Your daily source for curated AI news, practical tools, and actionable tutorials to master Artificial Intelligence;
  logo: "https://free.picui.cn/free/2026/02/21/6999aa72625e6.png"
  
  author:
    name: "数字旷野 日报"
    bio: "极简主义｜独立开发"
    email: "sunqiang323@163.com"
    website: "https://github.com/Qiangs1023"
    social:
      - name: "GitHub"
        url: "https://github.com/Qiangs1023"
        
  publisher:
    type: "Person" 
    name: "数字旷野 日报"
    url: "https://github.com/Qiangs1023"
    sameAs:
      - "https://github.com/Qiangs1023"
      
  displayUpdatedDate: true
  dateFormat: "2006/01/02 15:04:05"

  navbar:
    displayTitle: true
    displayLogo: true


  footer:
    displayCopyright: false
    displayPoweredBy: false

  blog:
    list:
      displayTags: true
      # date | lastmod | publishDate | title | weight
      sortBy: date
      sortOrder: desc # or "asc"
      # Pagination
      pagerSize: 10

    article:
      displayPagination: true

  toc:
    displayTags: false
    disable: true
  
  page:
    # full (100%), wide (90rem), normal (1280px)
    width: wide

    # 搜索
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # 按以下内容索引页面：content | summary | heading | title
      index: content

  comments:
    enable: false
    type: giscus

    giscus:
      repo: Qiangs1023/Hextra-AI-Insight-Daily
      repoId: R_kgDOO_2Owg
      category: Announcements
      categoryId: DIC_kwDOO_2Ows4Cr2Q0


defaultContentLanguage: zh
languages:
  zh:
    languageCode: zh-CN
    contentDir: content/cn
    languageName: 简体中文
    weight: 1
  en:
    contentDir: content/en
    languageName: English
    title: 数字旷野 日报 | AI News | AI Tools | AI Insights
    weight: 2
